[package]
name = "the-last-icey"
version = "1.0.0"
description = "The Last IceyPop — browser canvas survival game packaged as a desktop app."
authors = ["tflinch"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "the_last_icey_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
